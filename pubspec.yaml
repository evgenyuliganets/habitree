name: habitree
description: "A planner and goal‑tracking app to help you structure your day."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.6.2

dependencies:
  flutter:
    sdk: flutter

  # UI
  flutter_screenutil: ^5.9.3
  cupertino_icons: ^1.0.8
  flutter_svg: ^2.1.0

  # State Management
  flutter_riverpod: ^2.6.1

  #Translations
  slang: ^4.7.2
  slang_flutter: ^4.7.0

  # Firebase
  firebase_core: 3.12.1
  google_sign_in: ^6.3.0

  # Local Database
  drift: ^2.26.1
  drift_flutter: ^0.2.4

  # Secure Storage
  flutter_secure_storage: ^9.2.4

  # HTTP / Networking
  dio: ^5.8.0
  pretty_dio_logger: ^1.4.0

  # Dependency Injection
  injectable: ^2.5.0
  get_it: ^8.0.3

  # Models / Code Generation
  freezed_annotation: ^2.4.4
  json_annotation: ^4.9.0

# DEV DEPENDENCIES
dev_dependencies:
  flutter_test:
    sdk: flutter

  #Analysis
  very_good_analysis: ^7.0.0

  # Code Generation
  build_runner: ^2.4.15
  injectable_generator: ^2.7.0
  freezed: ^2.5.8
  json_serializable: ^6.9.5
  slang_build_runner: ^4.7.0

flutter:
  uses-material-design: true

  assets:
    - assets/fonts/Manrope/
    - assets/icons/auth/

fonts:
  - family: Manrope
    fonts:
      - asset: assets/fonts/Manrope/Manrope-ExtraLight.ttf
        weight: 200
      - asset: assets/fonts/Manrope/Manrope-Light.ttf
        weight: 300
      - asset: assets/fonts/Manrope/Manrope-Regular.ttf
        weight: 400
      - asset: assets/fonts/Manrope/Manrope-Medium.ttf
        weight: 500
      - asset: assets/fonts/Manrope/Manrope-SemiBold.ttf
        weight: 600
      - asset: assets/fonts/Manrope/Manrope-Bold.ttf
        weight: 700
      - asset: assets/fonts/Manrope/Manrope-ExtraBold.ttf
        weight: 800
