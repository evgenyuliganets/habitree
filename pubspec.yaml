name: habitree
description: "A planner and goal-tracking app to help you structure your day."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.6.2

dependencies:
  flutter:
    sdk: flutter
  flutter_screenutil: ^5.9.3

  cupertino_icons: ^1.0.8

dev_dependencies:
  flutter_test:
    sdk: flutter

  very_good_analysis: ^7.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/fonts/Manrope/

fonts:
  - family: Manrope
    fonts:
      - asset: assets/fonts/Manrope/Manrope-ExtraLight.ttf
        weight: 200
      - asset: assets/fonts/Manrope/Manrope-Light.ttf
        weight: 300
      - asset: assets/fonts/Manrope/Manrope-Regular.ttf
        weight: 400
      - asset: assets/fonts/Manrope/Manrope-Medium.ttf
        weight: 500
      - asset: assets/fonts/Manrope/Manrope-SemiBold.ttf
        weight: 600
      - asset: assets/fonts/Manrope/Manrope-Bold.ttf
        weight: 700
      - asset: assets/fonts/Manrope/Manrope-ExtraBold.ttf
        weight: 800
